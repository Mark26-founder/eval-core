cases:
  - id: sum_1
    input: "Summarize the following text in one sentence: Machine learning is a subset of artificial intelligence that focuses on building systems that can learn from data. These systems improve their performance over time without being explicitly programmed for every scenario."
    expected: "Machine learning is a subset of AI that enables systems to learn from data and improve over time."
    description: "Basic summarization task"
    tags: ["summarization", "ai"]

  - id: sum_2
    input: "Summarize this paragraph: The Python programming language was created by Guido van Rossum and first released in 1991. Python emphasizes code readability and allows programmers to express concepts in fewer lines of code than languages like C++ or Java."
    expected: "Python, created by Guido van Rossum in 1991, emphasizes readability and concise code."
    description: "Historical summarization"
    tags: ["summarization", "programming"]

  - id: sum_3
    input: "Provide a one-sentence summary: Climate change refers to long-term shifts in global temperatures and weather patterns. While climate change is a natural phenomenon, scientific evidence shows that human activities, particularly burning fossil fuels, have been the main driver of climate change since the 1800s."
    expected: "Climate change involves long-term temperature and weather shifts, primarily driven by human activities since the 1800s."
    description: "Scientific topic summarization"
    tags: ["summarization", "science"]

  - id: sum_4
    input: "Summarize: The Renaissance was a cultural movement that began in Italy in the 14th century and spread throughout Europe. It marked the transition from the Middle Ages to modernity and was characterized by renewed interest in classical art, literature, and learning."
    expected: "The Renaissance was a 14th-century cultural movement starting in Italy that revived classical learning and marked the transition to modernity."
    description: "Historical period summarization"
    tags: ["summarization", "history"]
